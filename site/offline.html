<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9edf1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d2229" media="(prefers-color-scheme: dark)">
  <title>Offline | Signal Path</title>
  <!--
    Shown by the service worker when a page can't load and isn't saved yet. It
    has to stand alone: no shared stylesheet, no web fonts, nothing that needs
    the network except the icon, which is saved with everything else.
  -->
  <style>
    :root { color-scheme: light dark; --bg: #e9edf1; --ink: #18212d; --ink2: #4a5666; --btn: #18212d; --btnfg: #f8fafc; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d2229; --ink: #d2d8df; --ink2: #9ca6b2; --btn: #3d4d66; --btnfg: #e3e8ee; } }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--ink); text-align: center;
    }
    .card { max-width: 360px; }
    img { width: 80px; height: 80px; margin: 0 auto 20px; display: block; }
    h1 { font-size: 21px; margin: 0 0 8px; font-weight: 650; }
    p { margin: 0 0 24px; color: var(--ink2); font-size: 15px; line-height: 1.5; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a, button {
      font: inherit; font-size: 15px; font-weight: 600; text-decoration: none;
      padding: 11px 20px; border-radius: 9px; border: 0; cursor: pointer;
      background: var(--btn); color: var(--btnfg);
    }
    a { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink2); }
  </style>
</head>
<body>
  <div class="card">
    <img src="./icons/icon-192.png" alt="">
    <h1>This page isn’t saved yet</h1>
    <p>You’re offline, and this page hasn’t been downloaded to this device. Every lesson is saved after your first visit online, so the rest of the course should still open.</p>
    <div class="row">
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="./">Go to the course</a>
    </div>
  </div>
  <script>
    // Come back by ourselves as soon as the connection does.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
